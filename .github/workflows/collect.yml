name: Collect notices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7

      - name: Python 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 필요한 모듈 설치
        run: python -m pip install requests beautifulsoup4

      - name: 공지 수집 실행
        run: python src/crawler.py

      - name: 수집 결과 저장
        uses: actions/upload-artifact@v7
        with:
          name: notices-test
          path: data/notices_test.json
          if-no-files-found: error