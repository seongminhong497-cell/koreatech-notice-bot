# 한기대 공지비서: "[설정]" 이슈가 올라오면 profile.json을 바꾸고 별점을 다시 계산한다.

name: 설정 바꾸기

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write              # profile.json, notices.json 커밋
  issues: write                # 결과 댓글 달고 이슈 닫기

concurrency:
  group: daily-notice          # 공지 자동 정리와 동시에 저장하지 않도록 같은 줄에 세운다
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[설정]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
    steps:
      - name: 권한 확인 (저장소 주인과 팀원만)
        env:
          ASSOC: ${{ github.event.issue.author_association }}
        run: |
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "권한 확인: $ASSOC" ;;
            *)
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" \
                --body "저장소 주인과 팀원만 설정을 바꿀 수 있습니다."
              gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
              exit 1 ;;
          esac

      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          # main이 보호되어 있어서, 결과를 push할 수 있는 토큰으로 가져온다
          token: ${{ secrets.BOT_PUSH_TOKEN }}

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 이슈 본문은 env로 넘겨서, 본문 내용이 명령어로 실행되지 않게 한다
      - name: 설정 적용
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          python src/apply_settings.py | tee "$RUNNER_TEMP/result.txt"

      - name: 별점 다시 계산
        run: |
          if [ -f src/relevance.py ]; then
            python src/relevance.py > /dev/null
            echo "새 설정으로 별점을 다시 계산했습니다."
          fi

      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json data/notices.json
          if git diff --cached --quiet; then
            echo "바뀐 설정이 없습니다."
            exit 0
          fi
          git commit -m "설정 변경: 이슈 #$NUM"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 결과 알리기
        if: always() && steps.apply.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.apply.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          page="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          result="$(cat "$RUNNER_TEMP/result.txt" 2>/dev/null)"
          if [ "$JOB_STATUS" = "success" ]; then
            printf '%s\n\n%s\n\n웹페이지에서 바뀐 별점을 확인할 수 있습니다: %s\n' \
              "$result" "다음 아침 브리핑부터 새 설정이 적용됩니다." "$page" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
          elif [ "$OUTCOME" = "failure" ]; then
            printf '%s\n\n%s\n' "$result" \
              "이슈 본문을 고쳐서 저장(Edit)하면 다시 적용됩니다." > "$RUNNER_TEMP/comment.md"
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          else
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" \
              --body "설정은 확인했지만 저장 중에 문제가 생겼습니다. Actions 탭의 '설정 바꾸기' 실행 기록을 확인해 주세요."
          fi
