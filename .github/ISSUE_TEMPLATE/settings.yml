name: 내 설정 바꾸기
description: 학과, 학년, 관심 분야, 나이, 지역을 바꾸면 다음 실행부터 별점이 새 설정으로 매겨집니다.
title: "[설정] 내 설정 바꾸기"
labels: ["settings"]
body:
  - type: markdown
    attributes:
      value: |
        아래 항목을 고르고 **Create**를 누르면 몇 분 안에 설정이 바뀌고, 공지 별점이 새 설정으로 다시 계산됩니다.
        결과는 이 이슈에 댓글로 알려드리고 이슈는 자동으로 닫힙니다. 저장소 주인과 팀원만 바꿀 수 있습니다.

  - type: dropdown
    id: department
    attributes:
      label: 학과
      options:
        - 기계공학부
        - 메카트로닉스공학부
        - 전기·전자·통신공학부
        - 컴퓨터공학부
        - 디자인공학과
        - 건축공학과
        - 에너지신소재화학공학부
        - 산업경영학부
        - 고용서비스정책학과
        - 미래융합학부
        - 반도체·디스플레이공학과
    validations:
      required: true

  - type: dropdown
    id: year
    attributes:
      label: 학년
      options:
        - "1"
        - "2"
        - "3"
        - "4"
    validations:
      required: true

  - type: dropdown
    id: enrollment_status
    attributes:
      label: 학적
      options:
        - 재학
        - 휴학
    validations:
      required: true

  - type: dropdown
    id: dorm_resident
    attributes:
      label: 생활관에 살고 있나요?
      options:
        - 예
        - 아니요
    validations:
      required: true

  - type: checkboxes
    id: interests
    attributes:
      label: 관심 분야
      description: 별점을 높게 받을 분류를 골라주세요. 여러 개 고를 수 있어요.
      options:
        - label: 장학
        - label: 학사
        - label: 취업·인턴
        - label: 교내활동
        - label: 대외활동·공모전
        - label: 생활관
        - label: 청년정책

  - type: checkboxes
    id: always_show
    attributes:
      label: 항상 보기
      description: 관심 분야가 아니어도 빠짐없이 보고 싶은 분류예요.
      options:
        - label: 장학
        - label: 학사
        - label: 취업·인턴
        - label: 교내활동
        - label: 대외활동·공모전
        - label: 생활관
        - label: 청년정책

  - type: checkboxes
    id: excluded
    attributes:
      label: 안 보기
      description: 이 분류의 공지는 숨깁니다.
      options:
        - label: 장학
        - label: 학사
        - label: 취업·인턴
        - label: 교내활동
        - label: 대외활동·공모전
        - label: 생활관
        - label: 청년정책

  - type: input
    id: birth_year
    attributes:
      label: 출생연도
      description: 청년정책의 나이 조건(예 만 19~34세)을 확인할 때 써요. 비워두면 나이 조건을 확인하지 않습니다.
      placeholder: "2006"

  - type: dropdown
    id: region
    attributes:
      label: 거주 지역 (주민등록상 주소)
      description: 청년정책은 대부분 주민등록 주소 기준이에요. 생활관에 살아도 주민등록 주소를 골라주세요.
      options:
        - 선택 안 함
        - 충남 천안시 동남구 (44131)
        - 충남 천안시 서북구 (44133)
        - 충남 공주시 (44150)
        - 충남 보령시 (44180)
        - 충남 아산시 (44200)
        - 충남 서산시 (44210)
        - 충남 논산시 (44230)
        - 충남 계룡시 (44250)
        - 충남 당진시 (44270)
        - 충남 금산군 (44710)
        - 충남 부여군 (44760)
        - 충남 서천군 (44770)
        - 충남 청양군 (44790)
        - 충남 홍성군 (44800)
        - 충남 예산군 (44810)
        - 충남 태안군 (44825)
        - 대전 동구 (30110)
        - 대전 중구 (30140)
        - 대전 서구 (30170)
        - 대전 유성구 (30200)
        - 대전 대덕구 (30230)
        - 세종 세종시 (36110)
        - 그 외 지역 (아래 칸에 직접 입력)

  - type: input
    id: region_custom
    attributes:
      label: 그 외 지역 직접 입력
      description: 목록에 없을 때만 적어주세요. "시도 시군구 코드5자리" 형식입니다. 코드는 행정표준코드(code.go.kr)에서 찾을 수 있어요.
      placeholder: "충북 청주시 상당구 43111"

  - type: input
    id: urgent_days
    attributes:
      label: 마감 임박 기준 (일)
      description: 마감이 며칠 남았을 때부터 "마감 임박"에 넣을지 정해요. 비워두면 3일입니다.
      placeholder: "3"

  - type: input
    id: preparation_days
    attributes:
      label: 준비물이 있는 공지의 마감 임박 기준 (일)
      description: 서류 같은 준비물이 필요한 공지는 더 일찍 알려줘요. 비워두면 7일입니다.
      placeholder: "7"
